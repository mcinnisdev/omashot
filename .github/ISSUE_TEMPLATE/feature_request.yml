name: Feature request
description: Something you wish Omacut did, or did differently.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. A sketch or a marked-up quick shot is welcome.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode
      options:
        - Omacut Basic (quick shots)
        - Omacut Bundles
        - Omacut Studio
        - All of them / not sure
    validations:
      required: true
