name: Release

# Pushing a tag like v2.1.0 builds the installers on Windows and publishes
# a GitHub release with them and generated notes. `npm run release 2.1.0`
# (scripts/release.mjs) bumps the version everywhere, commits, tags and
# pushes, which is what triggers this. The site's Download links point at
# releases/latest, so they pick the new one up on their own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag but package.json says $ver" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the app, creates a draft release for the tag, and uploads
      # the MSI and NSIS installers to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QACut ${{ github.ref_name }}
          releaseDraft: true

      - name: Release notes from the commits, then publish
        shell: bash
        run: |
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          args=(-f tag_name="$GITHUB_REF_NAME")
          if [ -n "$prev" ]; then args+=(-f previous_tag_name="$prev"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          {
            echo "Windows 10 (2004+) or 11, x64. The installers are not code-signed yet: SmartScreen will warn on first run; choose **More info**, then **Run anyway**."
            echo
            cat notes.md
          } > body.md
          gh release edit "$GITHUB_REF_NAME" --title "QACut $GITHUB_REF_NAME" --notes-file body.md --draft=false --latest
