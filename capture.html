<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Capture</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="capture">
    <img id="frame" alt="" />
    <div id="scrim"></div>
    <div class="guide v" id="guide-v"></div>
    <div class="guide h" id="guide-h"></div>
    <div id="sel">
      <div class="handle" data-edges="n"></div>
      <div class="handle" data-edges="s"></div>
      <div class="handle" data-edges="e"></div>
      <div class="handle" data-edges="w"></div>
      <div class="handle" data-edges="ne"></div>
      <div class="handle" data-edges="nw"></div>
      <div class="handle" data-edges="se"></div>
      <div class="handle" data-edges="sw"></div>
    </div>
    <div id="dims"></div>
    <div id="tools">
      <button class="btn" id="tool-cancel">Cancel</button>
      <button class="btn primary" id="tool-record">Record</button>
    </div>
    <div id="hint">
      <b>Drag</b> to select the region
      <kbd>Esc</kbd> cancel
    </div>
    <script type="module" src="/src/capture.ts"></script>
  </body>
</html>
