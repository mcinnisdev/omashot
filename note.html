<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Note</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="note">
    <div class="note-wrap">
      <div class="note-head" data-tauri-drag-region>
        <span id="head-label" data-tauri-drag-region>Note</span>
        <input class="inline" id="group-title" aria-label="Group name" />
        <span class="sep" id="sep">/</span>
        <input class="inline" id="shot-title" aria-label="Shot name" />
      </div>
      <div class="note-body">
        <p class="hint" id="group-hint" hidden></p>
        <div class="note-row">
          <button class="note-thumb" id="thumb" hidden title="Mark it up: arrows, highlights, blur, step counters (Ctrl+E)" aria-label="Edit this screenshot">
            <img id="thumb-img" alt="" />
            <span>Edit</span>
          </button>
          <textarea class="field" id="note" placeholder="What's wrong here?"></textarea>
        </div>
      </div>
      <div class="note-foot" data-tauri-drag-region>
        <span class="keys" id="keys" data-tauri-drag-region>
          <kbd>Enter</kbd> save
          <kbd>Shift</kbd>+<kbd>Enter</kbd> new line
        </span>
        <span class="actions">
          <button class="linkish" id="new-batch" hidden>New batch</button>
          <button class="linkish" id="secondary">Discard shot</button>
        </span>
      </div>
    </div>
    <script type="module" src="/src/note.ts"></script>
  </body>
</html>
