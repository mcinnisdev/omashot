<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bundle</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="peek">
    <div class="peek-wrap">
      <div class="peek-head" data-tauri-drag-region>
        <h1 data-tauri-drag-region>Bundle</h1>
        <input
          class="bundle-name"
          id="bundle-name"
          placeholder="Name this bundle"
          aria-label="Bundle name"
        />
        <span class="count" id="count" data-tauri-drag-region></span>
        <button class="btn" id="close">Close</button>
      </div>
      <div class="peek-tools">
        <select class="btn" id="purpose" aria-label="What this bundle is for">
          <option value="fix">Fix issues</option>
          <option value="document">Write process doc</option>
          <option value="custom">Custom prompt</option>
        </select>
        <button class="btn" id="copy-prompt">Copy agent prompt</button>
        <button class="btn" id="copy-path">Copy folder path</button>
        <button class="btn" id="copy-md">Copy markdown</button>
        <button class="btn" id="open-folder">Open folder</button>
        <span class="spacer"></span>
        <button class="btn" id="new-bundle">New bundle</button>
      </div>
      <div class="custom" id="custom" hidden>
        <textarea
          id="custom-prompt"
          placeholder="Your own instructions for the agent. {root} becomes the bundle folder path and {name} the bundle name. Saved to ~/QACut/custom-prompt.txt and reused for every bundle."
        ></textarea>
      </div>
      <div class="exported" id="exported">
        <span id="exported-label">Bundle written to</span>
        <code id="exported-path"></code>
      </div>
      <div class="peek-body" id="body"></div>
      <div class="peek-foot">
        <span><kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>2</kbd> capture</span>
        <span><kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> record / stop</span>
        <span><kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd> new group</span>
        <span><kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>Q</kbd> show bundle</span>
        <span><kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>Enter</kbd> finish</span>
      </div>
    </div>
    <script type="module" src="/src/peek.ts"></script>
  </body>
</html>
