<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recording</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="rec">
    <div id="hole"></div>
    <video id="cam" hidden autoplay muted playsinline></video>
    <div class="rec-pill" id="pill">
      <span class="dot"></span>
      <span class="label" id="label">REC</span>
      <span class="time" id="time">0:00</span>
      <span class="stop" id="stop"></span>
    </div>
    <script type="module" src="/src/rec.ts"></script>
  </body>
</html>
