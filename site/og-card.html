<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1b1b1f;
    color: #fff;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 560px 1fr;
    gap: 40px;
    padding: 64px 72px;
    align-items: center;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
  .brand img { height: 44px; }
  .brand span { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .brand b { color: #ff5b5b; font-weight: 700; }
  h1 { font-size: 58px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 22px; }
  h1 em { font-style: normal; color: #ff5b5b; }
  p { font-size: 22px; line-height: 1.4; color: #b9bcc3; }
  .foot { margin-top: 30px; font-size: 17px; color: #7d818a; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }

  .stage {
    position: relative; width: 500px; height: 281px; border-radius: 14px;
    background: linear-gradient(135deg, #141a2b, #2a1f4d);
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06) inset;
    overflow: hidden; justify-self: end;
  }
  .stage .title { position: absolute; top: 5.5%; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 16px; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .stage .logo { position: absolute; left: 3%; top: 4%; height: 8%; opacity: .9; }
  .win { position: absolute; left: 9%; right: 9%; top: 17%; bottom: 13%; border-radius: 10px; background: #1b1f26; box-shadow: 0 18px 40px rgba(0,0,0,.5); overflow: hidden; }
  .bar { height: 11%; background: #262c35; display: flex; align-items: center; gap: 5px; padding: 0 10px; }
  .bar i { width: 8px; height: 8px; border-radius: 50%; background: #4a5563; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .side { position: absolute; top: 11%; bottom: 0; left: 0; width: 26%; background: #202630; padding: 10% 8%; }
  .side b, .main b { display: block; height: 6px; border-radius: 3px; background: #3a4350; margin-bottom: 9px; }
  .side b:first-child { background: #ff5b5b; width: 70%; }
  .main { position: absolute; top: 11%; bottom: 0; left: 26%; right: 0; padding: 6% 7%; }
  .main b.w1 { width: 55%; height: 10px; background: #6b7684; } .main b.w2 { width: 85%; } .main b.w3 { width: 70%; }
  .field { height: 12%; border: 1px solid #3a4350; border-radius: 6px; margin: 12px 0 10px; width: 80%; }
  .btn { display: inline-block; padding: 4% 9%; border-radius: 6px; background: #ff5b5b; color: #fff; font-size: 12px; font-weight: 650; }
  .ripple { position: absolute; left: 57%; top: 69%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); background: rgba(255,255,255,.18); }
  .cursor { position: absolute; left: 57%; top: 69%; width: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .keys { position: absolute; left: 50%; bottom: 4.5%; transform: translateX(-50%); padding: 5px 10px; border-radius: 7px; background: rgba(14,17,20,.85); border: 1px solid rgba(255,255,255,.18); font-family: Consolas, monospace; font-size: 12px; font-weight: 600; }
  .cam { position: absolute; right: 11.5%; bottom: 15.5%; width: 17%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3d1b8, #b27a5c 60%, #6b4531); border: 2px solid rgba(255,255,255,.35); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div>
  <div class="brand"><img src="file:///C:/projects/omacut/site/public/logo.png" alt="" /><span><b>QA</b>Cut</span></div>
  <h1>Capture your screen.<br /><em>Hand off the work.</em></h1>
  <p>Screenshots an AI agent can act on. Screen recordings people will actually watch.</p>
  <div class="foot">Free · Open source · Windows</div>
</div>
<div class="stage">
  <img class="logo" src="file:///C:/projects/omacut/site/public/logo.png" alt="" />
  <div class="title">Unlink OneDrive from this computer</div>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="side"><b></b><b></b><b></b><b></b><b></b></div>
    <div class="main"><b class="w1"></b><b class="w2"></b><b class="w3"></b><div class="field"></div><span class="btn">Unlink this PC</span></div>
  </div>
  <div class="ripple"></div>
  <svg class="cursor" viewBox="0 0 20 20"><path d="M0 0v16l4.2-3.4L7.2 19l3-1.3-2.9-6.3h5.1z" fill="#fff" stroke="rgba(0,0,0,.9)" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <div class="keys">Ctrl+Shift+R</div>
  <div class="cam"></div>
</div>
</body>
</html>
