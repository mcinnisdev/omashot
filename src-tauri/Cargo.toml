[package]
name = "qacut"
version = "2.0.0"
description = "Capture, group and note screenshots, then hand the bundle to an agent"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = "0.22"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
# Mouse and Enter polling while recording (v1), cursor/keyboard/window
# events and QPC timestamps for studio recordings (v2).
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Studio source capture: Windows.Graphics.Capture, frames GPU-side into H.264.
windows-capture = "2.0"
# H.264 MP4 output through the encoder that ships with Windows.
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
