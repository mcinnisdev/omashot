[package]
name = "qacut"
version = "0.1.0"
description = "Capture, group and note screenshots, then hand the bundle to an agent"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
# Mouse and Enter polling while recording; no hooks, no permissions.
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
